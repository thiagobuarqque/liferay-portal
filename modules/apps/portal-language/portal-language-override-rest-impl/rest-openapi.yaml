components:
    schemas:
        LanguageOverride:
            description:
                "A language override for a company"
            properties:
                creator:
                    $ref: ../../headless/headless-admin-user/headless-admin-user-impl/rest-openapi.yaml#Creator
                    description:
                        "The user who created the language override"
                    readOnly: true
                dateCreated:
                    description:
                        "The date the language override was created"
                    format: date-time
                    type: string
                dateModified:
                    description:
                        "The date the language override was last modified"
                    format: date-time
                    type: string
                key:
                    description:
                        "The translation key being overridden"
                    type: string
                languageId:
                    description:
                        "The locale of the override"
                    type: string
                value:
                    description:
                        "The overriding translation value"
                    type: string
            required:
                -   key
                -   languageId
                -   value
            type: object
info:
    description:
        "Manage instance-scoped language override entries. A Java client JAR is available for use with the group ID 'com.liferay', artifact ID 'com.liferay.portal.language.override.rest.client', and version '1.0.0'."
    license:
        name: Apache 2.0
        url: http://www.apache.org/licenses/LICENSE-2.0.html
    title: Language Override
    version: v1.0
openapi: 3.0.1
paths:
    "/language-overrides":
        delete:
            description:
                "Deletes the language override for the given key and language ID"
            operationId: deleteLanguageOverride
            parameters:
                -   in: query
                    name: key
                    required: true
                    schema:
                        type: string
                -   in: query
                    name: languageId
                    required: true
                    schema:
                        type: string
            responses:
                204:
                    content:
                        application/json: {}
                        application/xml: {}
            tags: ["LanguageOverride"]
        get:
            description:
                "Lists the company's language overrides"
            operationId: getLanguageOverridesPage
            parameters:
                -   in: query
                    name: keywords
                    schema:
                        type: string
                -   in: query
                    name: page
                    schema:
                        type: integer
                -   in: query
                    name: pageSize
                    schema:
                        type: integer
                -   in: query
                    name: sort
                    schema:
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/LanguageOverride"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/LanguageOverride"
                                type: array
            tags: ["LanguageOverride"]
        post:
            description:
                "Creates or updates a language override"
            operationId: postLanguageOverride
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/LanguageOverride"
                    application/xml:
                        schema:
                            $ref: "#/components/schemas/LanguageOverride"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/LanguageOverride"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/LanguageOverride"
            tags: ["LanguageOverride"]